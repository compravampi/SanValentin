<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para Pau 💙</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:linear-gradient(to bottom,#89CFF0,#B0E0E6,#E0F7FF);
    text-align:center;
    font-family:'Cormorant Garamond', serif;
}

/* Brillitos */
body::after{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background-image:radial-gradient(white 1px, transparent 1px);
    background-size:50px 50px;
    opacity:0.2;
    animation:sparkle 10s linear infinite;
    pointer-events:none;
}

@keyframes sparkle{
    from{transform:translateY(0);}
    to{transform:translateY(-50px);}
}

/* Nubes */
.cloud{
    position:absolute;
    top:50px;
    width:200px;
    height:60px;
    background:white;
    border-radius:50px;
    opacity:0.7;
    animation:moveCloud 60s linear infinite;
}

.cloud:before,.cloud:after{
    content:"";
    position:absolute;
    background:white;
    width:100px;
    height:80px;
    border-radius:50%;
    top:-40px;
}

.cloud:before{ left:20px; }
.cloud:after{ right:20px; }

@keyframes moveCloud{
    from{ left:-250px; }
    to{ left:110%; }
}

.container{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:90%;
    max-width:850px;
    z-index:2;
}

.big-heart{
    font-size:180px;
    animation:beat 1s infinite;
}

@keyframes beat{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.25);}
}

.explode{
    animation:explode 0.8s forwards;
}

@keyframes explode{
    to{transform:scale(5);opacity:0;}
}

.hidden{display:none;}

.question{
    font-family:'Playfair Display', serif;
    font-size:50px;
    color:#083d5c;
    margin-bottom:40px;
}

button{
    font-size:26px;
    padding:14px 30px;
    margin:20px;
    border-radius:40px;
    border:none;
    cursor:pointer;
}

#yesBtn{
    background:#083d5c;
    color:white;
}

#noBtn{
    background:#444;
    color:white;
    position:relative;
}

#taunt{
    margin-top:20px;
    font-size:22px;
    color:#b00020;
    font-weight:bold;
}

#message{
    font-family:'Playfair Display', serif;
    font-size:38px;
    color:#06263a;
    min-height:220px;
    line-height:1.5;
}

#counter{
    margin-top:25px;
    font-size:22px;
    color:#06263a;
}

.song-btn{
    margin-top:30px;
    font-size:20px;
    padding:12px 25px;
    background:#083d5c;
    color:white;
    border-radius:40px;
}

canvas{
    position:fixed;
    top:0;
    left:0;
    pointer-events:none;
    z-index:1;
}
</style>
</head>
<body>

<div class="cloud" style="animation-delay:0s;"></div>
<div class="cloud" style="top:100px; animation-delay:20s;"></div>

<canvas id="fireworks"></canvas>

<div class="container">

<div id="intro">
    <div id="bigHeart" class="big-heart">💙</div>
</div>

<div id="questionSection" class="hidden">
    <div class="question">Paulina 💙<br>¿Quieres ser mi San Valentín?</div>
    <button id="yesBtn" onclick="yes()">Sí</button>
    <button id="noBtn">No</button>
    <div id="taunt"></div>
</div>

<div id="finalSection" class="hidden">
    <div id="message"></div>
    <div id="counter"></div>

    <button class="song-btn"
        onclick="window.open('https://www.youtube.com/watch?v=Hs_RA08hVgU','_blank')">
        🎵 Escuchar nuestra canción
    </button>
</div>

</div>

<script>
const bigHeart=document.getElementById("bigHeart");
const intro=document.getElementById("intro");
const questionSection=document.getElementById("questionSection");
const finalSection=document.getElementById("finalSection");
const noBtn=document.getElementById("noBtn");
const taunt=document.getElementById("taunt");
const messageDiv=document.getElementById("message");

let attempts=0;

setTimeout(()=>{
    bigHeart.classList.add("explode");
    setTimeout(()=>{
        intro.classList.add("hidden");
        questionSection.classList.remove("hidden");
    },800);
},3000);

function moveNo(){
    attempts++;
    const x=Math.random()*400-200;
    const y=Math.random()*300-150;
    noBtn.style.transform=`translate(${x}px,${y}px)`;

    if(attempts>=5){
        taunt.innerText="No puedes atraparme 😜";
    }
}
noBtn.addEventListener("mouseover",moveNo);
noBtn.addEventListener("click",moveNo);

function yes(){
    questionSection.classList.add("hidden");
    finalSection.classList.remove("hidden");
    typeWriter();
}

const text=`Gracias por darle SI y querer ser mi San Valentín mi amor.

Te amo con todo mi corazón.
Este sábado te veo para disfrutarlo así como los días que hemos pasado juntos.

Gracias por ser esa persona que me llena de amor.
TE AMO Pau ♥`;

let i=0;
function typeWriter(){
    if(i<text.length){
        messageDiv.innerHTML+=text.charAt(i);
        i++;
        setTimeout(typeWriter,35);
    }
}

function updateCounter(){
    const startDate=new Date("2024-09-21T00:00:00");
    const now=new Date();
    const diff=now-startDate;

    const days=Math.floor(diff/(1000*60*60*24));
    const hours=Math.floor((diff/(1000*60*60))%24);
    const minutes=Math.floor((diff/(1000*60))%60);
    const seconds=Math.floor((diff/1000)%60);

    document.getElementById("counter").innerHTML=
    days+" días, "+hours+" horas, "+
    minutes+" minutos y "+seconds+" segundos juntos 💙";
}
setInterval(updateCounter,1000);

/* Fuegos artificiales mejorados */
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

const colors=[
    "#083d5c",
    "#1e88e5",
    "#42a5f5",
    "#1565c0",
    "#5e92f3",
    "#ff6b81",
    "#ff9f43"
];

function createFirework(){
    const x=Math.random()*canvas.width;
    const y=Math.random()*canvas.height;
    const color=colors[Math.floor(Math.random()*colors.length)];

    for(let i=0;i<12;i++){
        const angle=Math.random()*Math.PI*2;
        const speed=Math.random()*2+1.5;

        particles.push({
            x:x,
            y:y,
            vx:Math.cos(angle)*speed,
            vy:Math.sin(angle)*speed,
            alpha:1,
            color:color
        });
    }
}

function drawHeart(x,y,size,alpha,color){
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.bezierCurveTo(x-size,y-size,x-size*2,y+size/2,x,y+size*2);
    ctx.bezierCurveTo(x+size*2,y+size/2,x+size,y-size,x,y);
    ctx.fill();
    ctx.restore();
}

function startFireworks(){
    setInterval(()=>{
        if(particles.length<120){
            createFirework();
        }
    },1500);

    function animate(){
        ctx.clearRect(0,0,canvas.width,canvas.height);

        particles.forEach((p,index)=>{
            p.x+=p.vx;
            p.y+=p.vy;
            p.alpha-=0.008;

            drawHeart(p.x,p.y,7,p.alpha,p.color);

            if(p.alpha<=0){
                particles.splice(index,1);
            }
        });

        requestAnimationFrame(animate);
    }

    animate();
}
startFireworks();
</script>

</body>
</html>
